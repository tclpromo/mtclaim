<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="https:////aws-obg-image-lb-2.tcl.com/content/dam/brandsite/it-resources/common/navigation/tcl-logo.svg" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    .iframe-container {
      position: relative;
      width: 100%;

    iframe {
      width: 100%;

    .loader {
      position: absolute;

      color: #666;
      z-index: 10;
    }
  </style>

<body>
  <div class="iframe-container">
    <div class="loader" id="loader">Loading app...</div>

      title="TCL MT Free Gift Claim Form"
      onload="document.getElementById('loader').style.display='none';"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
